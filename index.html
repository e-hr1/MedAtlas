<style>
    /* --- المتغيرات والتصميم الأساسي --- */
    :root {
        -webkit-tap-highlight-color: transparent;
        --TextColor: #000000;
        --primary: #4A6CF7;
        --primary-light: #6B8AFF;
        --primary-glow: rgba(107, 138, 255, 0.5);
        --secondary: #FF6B6B;
        --background: #f5f7ff;
        --background2: #889FF9;
        --card: #FFFFFF;
        --text: #2D3748;
        --text-light: #718096;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        --radius: 16px;
        --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        --blur: 8px;
        --glass-opacity: 0.85;
        --glass-border: 1px solid rgba(255, 255, 255, 0.3);
        --glass-background: rgba(255, 255, 255, var(--glass-opacity));
    }

    .dark-mode {
        --TextColor: #ffffff;
        --primary: #6B8AFF;
        --primary-light: #8BA4FF;
        --primary-glow: rgba(107, 138, 255, 0.5);
        --secondary: #FF8B8B;
        --background: #0f172a;
        --background2: #1a223f;
        --card: #1e293b;
        --text: #f8fafc;
        --text-light: #cbd5e1;
        --shadow: 0 10px 30px rgba(107, 138, 255, 0.15);
        --blur: 0px;
        --glass-opacity: 0.9;
        --glass-border: 1px solid rgba(107, 138, 255, 0.1);
        --glass-background: rgba(30, 41, 59, var(--glass-opacity));
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        transition: var(--transition);
    }

    body {
        font-family: 'Tajawal', sans-serif;
        background-color: var(--background);
        color: var(--text);
        line-height: 1.7;
        overflow-x: hidden;
        background-size: cover;
        background-attachment: fixed;
        min-height: 100vh;
    }

    /* --- شريط التنقل العلوي --- */
    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        background: var(--glass-background);
        backdrop-filter: blur(var(--blur));
        -webkit-backdrop-filter: blur(var(--blur));
        border-bottom: var(--glass-border);
        z-index: 1000;
        box-shadow: var(--shadow);
    }

    .navbar-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 22px;
        font-weight: 800;
        color: var(--primary);
        text-decoration: none;
    }

    .navbar-brand i {
        font-size: 26px;
    }

    .navbar-actions {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .icon-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: none;
        background: var(--glass-background);
        backdrop-filter: blur(var(--blur));
        color: var(--primary);
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border: var(--glass-border);
        position: relative;
    }

    .icon-btn:hover {
        background: var(--primary);
        color: #fff;
        transform: scale(1.05);
    }

    .icon-btn .badge {
        position: absolute;
        top: 2px;
        left: 2px;
        background: var(--secondary);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--card);
    }

    /* --- المحتوى الرئيسي --- */
    .main-content {
        padding-top: 90px;
        padding-bottom: 40px;
        max-width: 1200px;
        margin: 0 auto;
        padding-left: 20px;
        padding-right: 20px;
    }

    /* --- العنوان الرئيسي --- */
    .hero-section {
        text-align: center;
        padding: 30px 0 20px;
    }

    .hero-section h1 {
        font-size: 32px;
        font-weight: 800;
        color: var(--primary);
        margin-bottom: 8px;
    }

    .hero-section p {
        font-size: 15px;
        color: var(--text-light);
        max-width: 600px;
        margin: 0 auto;
    }

    .stats-row {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-top: 20px;
        flex-wrap: wrap;
    }

    .stat-badge {
        background: var(--card);
        border-radius: 14px;
        padding: 12px 22px;
        box-shadow: var(--shadow);
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid rgba(74, 108, 247, 0.1);
    }

    .stat-badge i {
        color: var(--primary);
        font-size: 22px;
    }

    .stat-badge .num {
        font-size: 20px;
        font-weight: 800;
        color: var(--primary);
    }

    .stat-badge .lbl {
        font-size: 12px;
        color: var(--text-light);
    }

    /* --- شريط البحث --- */
    .search-wrapper {
        position: sticky;
        top: 78px;
        z-index: 900;
        padding: 12px 0;
        background: var(--background);
    }

    .search-box {
        display: flex;
        align-items: center;
        background: var(--glass-background);
        backdrop-filter: blur(var(--blur));
        border-radius: 18px;
        padding: 0 18px;
        border: var(--glass-border);
        box-shadow: var(--shadow);
    }

    .search-box i {
        color: var(--primary);
        font-size: 20px;
        margin-left: 12px;
    }

    .search-box input {
        flex: 1;
        border: none;
        background: transparent;
        padding: 16px 0;
        font-family: 'Tajawal', sans-serif;
        font-size: 15px;
        color: var(--text);
        outline: none;
    }

    .search-box input::placeholder {
        color: var(--text-light);
    }

    .search-clear {
        background: transparent;
        border: none;
        color: var(--text-light);
        cursor: pointer;
        font-size: 18px;
        display: none;
    }

    /* --- الفلاتر --- */
    .filters-row {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 14px 2px;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }

    .filters-row::-webkit-scrollbar {
        display: none;
    }

    .filter-chip {
        flex-shrink: 0;
        padding: 9px 18px;
        border-radius: 22px;
        background: var(--card);
        color: var(--text-light);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: 1.2px solid rgba(74, 108, 247, 0.15);
        white-space: nowrap;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.04);
        font-family: 'Tajawal', sans-serif;
    }

    .filter-chip.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
        box-shadow: 0 5px 18px var(--primary-glow);
    }

    .filter-chip:hover {
        border-color: var(--primary);
    }

    /* --- شبكة الأقسام والأجهزة --- */
    .departments-container {
        margin-top: 10px;
    }

    .department-section {
        margin-bottom: 32px;
    }

    .department-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
        padding-right: 4px;
    }

    .department-header .dep-icon {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: rgba(74, 108, 247, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary);
        font-size: 18px;
    }

    .department-header h2 {
        font-size: 17px;
        font-weight: 800;
        color: var(--text);
        flex: 1;
    }

    .department-header .dep-count {
        background: rgba(74, 108, 247, 0.1);
        color: var(--primary);
        padding: 4px 12px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 700;
    }

    .devices-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 14px;
    }

    .device-card {
        background: var(--card);
        border-radius: 20px;
        padding: 18px 12px 14px;
        text-align: center;
        box-shadow: var(--shadow);
        cursor: pointer;
        position: relative;
        border: 1px solid rgba(74, 108, 247, 0.08);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 150px;
        overflow: hidden;
    }

    .device-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 15px 35px rgba(74, 108, 247, 0.15);
        border-color: var(--primary-light);
    }

    .device-card .device-icon {
        font-size: 34px;
        color: var(--primary);
        margin-bottom: 8px;
    }

    .device-card .device-name {
        font-size: 14px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
    }

    .device-card .device-en {
        font-size: 11px;
        color: var(--text-light);
        margin-bottom: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
    }

    .device-card .device-desc {
        font-size: 10.5px;
        color: var(--text-light);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
    }

    .fav-btn {
        position: absolute;
        top: 8px;
        left: 8px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: none;
        background: rgba(74, 108, 247, 0.06);
        color: #9CA3AF;
        cursor: pointer;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
    }

    .fav-btn.active {
        background: rgba(229, 57, 53, 0.12);
        color: #E53935;
    }

    .fav-btn:hover {
        transform: scale(1.1);
    }

    /* --- لا توجد نتائج --- */
    .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-light);
    }

    .empty-state i {
        font-size: 64px;
        opacity: 0.4;
        margin-bottom: 16px;
        display: block;
    }

    .empty-state h3 {
        font-size: 18px;
        margin-bottom: 6px;
        color: var(--text);
    }

    .empty-state p {
        font-size: 13px;
    }

    /* --- نافذة التفاصيل --- */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
        z-index: 2000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .modal-overlay.show {
        display: flex;
    }

    .modal-content {
        background: var(--card);
        border-radius: 24px;
        max-width: 500px;
        width: 100%;
        max-height: 85vh;
        overflow-y: auto;
        padding: 28px 24px;
        position: relative;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
    }

    .modal-close {
        position: absolute;
        top: 14px;
        left: 14px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: none;
        background: rgba(74, 108, 247, 0.08);
        color: var(--text-light);
        cursor: pointer;
        font-size: 16px;
    }

    .modal-close:hover {
        background: var(--secondary);
        color: #fff;
    }

    .modal-icon {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--primary-light));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        color: #fff;
        margin: 0 auto 16px;
        box-shadow: 0 10px 30px var(--primary-glow);
    }

    .modal-content h2 {
        text-align: center;
        font-size: 22px;
        font-weight: 800;
        color: var(--text);
        margin-bottom: 4px;
    }

    .modal-content .en-name {
        text-align: center;
        font-size: 14px;
        color: var(--text-light);
        margin-bottom: 16px;
    }

    .modal-category {
        display: inline-block;
        background: rgba(74, 108, 247, 0.1);
        color: var(--primary);
        padding: 4px 14px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 700;
        margin: 0 auto 18px;
    }

    .modal-info-row {
        display: flex;
        justify-content: center;
        margin-bottom: 18px;
    }

    .modal-section {
        margin-top: 16px;
    }

    .modal-section h3 {
        font-size: 14px;
        font-weight: 800;
        color: var(--primary);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .modal-section p {
        font-size: 13px;
        color: var(--text-light);
        line-height: 1.8;
    }

    /* --- زر العودة للأعلى --- */
    .back-to-top {
        position: fixed;
        bottom: 24px;
        left: 24px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--primary);
        color: #fff;
        border: none;
        cursor: pointer;
        font-size: 18px;
        box-shadow: 0 10px 30px var(--primary-glow);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 900;
    }

    .back-to-top.show {
        display: flex;
    }

    .back-to-top:hover {
        transform: translateY(-3px);
    }

    /* --- التذييل --- */
    .footer {
        text-align: center;
        padding: 30px 20px;
        color: var(--text-light);
        font-size: 13px;
        margin-top: 40px;
    }

    .footer a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 700;
    }

    /* --- استجابة الجوال --- */
    @media (max-width: 600px) {
        .hero-section h1 { font-size: 24px; }
        .hero-section p { font-size: 13px; }
        .devices-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .device-card {
            min-height: 130px;
            padding: 14px 8px 10px;
        }
        .device-card .device-icon { font-size: 28px; }
        .device-card .device-name { font-size: 12.5px; }
        .device-card .device-en { font-size: 10px; }
        .device-card .device-desc { font-size: 9.5px; }
        .stat-badge { padding: 8px 14px; }
        .stat-badge .num { font-size: 16px; }
        .navbar { padding: 0 14px; height: 62px; }
        .navbar-brand { font-size: 18px; }
        .navbar-brand i { font-size: 22px; }
        .main-content { padding-top: 78px; }
        .search-wrapper { top: 70px; }
    }

    /* --- وضع داكن --- */
    .dark-mode .device-card {
        border-color: rgba(107, 138, 255, 0.1);
    }

    .dark-mode .filter-chip {
        border-color: rgba(107, 138, 255, 0.15);
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
    }

    .dark-mode .stat-badge {
        border-color: rgba(107, 138, 255, 0.15);
    }

    .dark-mode .department-header .dep-icon {
        background: rgba(107, 138, 255, 0.2);
    }

    .dark-mode .department-header .dep-count {
        background: rgba(107, 138, 255, 0.15);
    }

    .dark-mode .search-box {
        background: rgba(30, 41, 59, 0.9);
    }

    .dark-mode .fav-btn {
        background: rgba(255, 255, 255, 0.06);
    }

    .dark-mode .fav-btn.active {
        background: rgba(229, 57, 53, 0.2);
    }
</style>

</head>

</body>
