    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" />

    <style>
        /* ============ المتغيرات ============ */
        :root {
            -webkit-tap-highlight-color: transparent;
            --TextColor: #000000;
            --primary: #3478F6;
            --primary-light: #5B8DEF;
            --primary-glow: rgba(52, 120, 246, 0.35);
            --secondary: #E53935;
            --background: #F4F7FC;
            --background-top: #F0F5FF;
            --background-bottom: #FFFFFF;
            --card: #FFFFFF;
            --card-glass: rgba(255, 255, 255, 0.85);
            --text: #1A1C1E;
            --text-body: #4B5563;
            --text-light: #8E939B;
            --border: #E3E8F0;
            --shadow: 0 10px 30px rgba(120, 146, 192, 0.08);
            --shadow-nav: 0 12px 30px rgba(30, 58, 138, 0.18);
            --radius: 24px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --blur: 25px;
        }

        .dark-mode {
            --TextColor: #ffffff;
            --primary: #5B8DEF;
            --primary-light: #7BA3FF;
            --primary-glow: rgba(91, 141, 239, 0.4);
            --secondary: #FF6B6B;
            --background: #0F1319;
            --background-top: #131A24;
            --background-bottom: #0B0E13;
            --card: #1E2430;
            --card-glass: rgba(255, 255, 255, 0.06);
            --text: #F1F4F8;
            --text-body: #C5CCD8;
            --text-light: #9BA3B0;
            --border: #2C3444;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.30);
            --shadow-nav: 0 12px 30px rgba(0, 0, 0, 0.55);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(180deg, var(--background-top) 0%, var(--background-bottom) 100%);
            background-attachment: fixed;
            color: var(--text);
            line-height: 1.7;
            overflow-x: hidden;
            min-height: 100vh;
            padding-bottom: 120px;
        }

        /* ============ الهيدر ============ */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 14px 24px;
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .logo i {
            font-size: 24px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 16px;
            position: relative;
        }

        .icon-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--primary-glow);
            border-color: var(--primary);
        }

        .icon-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .icon-btn.active.fav-btn {
            background: var(--secondary);
            border-color: var(--secondary);
        }

        .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            min-width: 18px;
            height: 18px;
            padding: 0 4px;
            border-radius: 10px;
            background: var(--secondary);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--card);
        }

        /* ============ الحاوية ============ */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 24px;
        }

        /* ============ البحث ============ */
        .search-wrapper {
            margin-bottom: 18px;
            position: relative;
            display: none;
        }

        .search-wrapper.visible {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 0 16px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .search-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .search-box i {
            color: var(--primary);
            font-size: 18px;
            margin-left: 10px;
        }

        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 14px 0;
            font-family: inherit;
            font-size: 14px;
            color: var(--text);
            outline: none;
            font-weight: 500;
        }

        .search-box input::placeholder {
            color: var(--text-light);
        }

        .clear-btn {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            padding: 6px;
            font-size: 16px;
            display: none;
            transition: var(--transition);
        }

        .clear-btn:hover {
            color: var(--secondary);
        }

        .clear-btn.visible {
            display: block;
        }

        /* ============ الفلاتر ============ */
        .filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 2px 12px;
            margin-bottom: 8px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .filters::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            flex-shrink: 0;
            padding: 10px 18px;
            border-radius: 22px;
            background: var(--card);
            border: 1.2px solid var(--border);
            color: var(--text-body);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            font-family: inherit;
        }

        .filter-chip:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-chip.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 6px 16px var(--primary-glow);
            font-weight: 700;
        }

        /* ============ الإحصائيات ============ */
        .stats-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 4px;
            margin-bottom: 16px;
            font-size: 13px;
            color: var(--text-light);
            font-weight: 600;
        }

        .stats-bar span strong {
            color: var(--primary);
            font-weight: 800;
        }

        /* ============ عنوان القسم ============ */
        .department {
            margin-bottom: 28px;
        }

        .department-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            padding: 0 4px;
        }

        .department-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: var(--primary-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 18px;
        }

        .department-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text);
            flex: 1;
        }

        .department-count {
            padding: 4px 12px;
            background: var(--primary-glow);
            color: var(--primary);
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
        }

        /* ============ شبكة الأجهزة ============ */
        .devices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
        }

        .device-card {
            position: relative;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 14px 16px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .device-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 30px var(--primary-glow);
            border-color: var(--primary);
        }

        .device-card .device-icon {
            font-size: 34px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .device-card .device-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .device-card .device-secondary {
            font-size: 11px;
            color: var(--text-light);
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
        }

        .device-card .device-desc {
            font-size: 11px;
            color: var(--text-light);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .fav-toggle {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: var(--card-glass);
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: var(--transition);
            z-index: 2;
        }

        .fav-toggle:hover {
            transform: scale(1.1);
        }

        .fav-toggle.active {
            background: rgba(229, 57, 53, 0.12);
            color: var(--secondary);
        }

        /* ============ حالة فارغة ============ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .empty-state i {
            font-size: 70px;
            color: var(--text-light);
            opacity: 0.5;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-body);
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 13px;
        }

        /* ============ شريط التنقل السفلي ============ */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 24px;
            right: 24px;
            max-width: 600px;
            margin: 0 auto;
            height: 74px;
            background: var(--card-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1.8px solid var(--border);
            border-radius: 34px;
            box-shadow: var(--shadow-nav);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 6px;
            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 8px 0;
            border-radius: 28px;
            cursor: pointer;
            transition: var(--transition);
            background: none;
            border: none;
            font-family: inherit;
            color: var(--text-light);
        }

        .nav-item:hover {
            color: var(--primary);
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item i {
            font-size: 20px;
            transition: var(--transition);
        }

        .nav-item.active i {
            transform: scale(1.1);
        }

        .nav-item span {
            font-size: 10px;
            font-weight: 600;
        }

        .nav-item.active span {
            font-weight: 800;
        }

        .nav-indicator {
            width: 0;
            height: 3px;
            background: var(--primary);
            border-radius: 10px;
            transition: var(--transition);
        }

        .nav-item.active .nav-indicator {
            width: 26px;
        }

        /* ============ المودال ============ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-overlay.visible {
            display: flex;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: var(--card);
            border-radius: 26px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-close {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: var(--background);
            color: var(--text-light);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: var(--secondary);
            color: #fff;
            transform: rotate(90deg);
        }

        .modal-header {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 22px;
            padding-left: 40px;
        }

        .modal-icon {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: var(--primary-glow);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            flex-shrink: 0;
        }

        .modal-title-block {
            flex: 1;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .modal-subtitle {
            font-size: 14px;
            color: var(--text-light);
            font-weight: 500;
        }

        .modal-fav-btn {
            margin-top: 8px;
            padding: 8px 14px;
            border-radius: 14px;
            border: 1.5px solid var(--border);
            background: transparent;
            color: var(--text-light);
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .modal-fav-btn:hover {
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .modal-fav-btn.active {
            background: rgba(229, 57, 53, 0.12);
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .modal-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .info-item {
            padding: 14px;
            background: var(--background);
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .info-item .label {
            font-size: 11px;
            color: var(--text-light);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .info-item .value {
            font-size: 13px;
            color: var(--text);
            font-weight: 700;
        }

        .modal-description {
            padding: 18px;
            background: var(--primary-glow);
            border-radius: 16px;
            margin-bottom: 16px;
        }

        .modal-description .label {
            font-size: 12px;
            color: var(--primary);
            font-weight: 800;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .modal-description .text {
            font-size: 14px;
            color: var(--text);
            line-height: 1.8;
        }

        .modal-extra {
            padding: 16px;
            background: var(--background);
            border-radius: 14px;
            border: 1px solid var(--border);
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
        }

        .modal-extra i {
            color: var(--primary);
            margin-left: 6px;
        }

        .modal-extra a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        /* ============ Toast ============ */
        .toast {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text);
            color: var(--background);
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 3000;
            white-space: nowrap;
        }

        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ============ Responsive ============ */
        @media (max-width: 640px) {
            .container { padding: 16px 14px; }
            .header { padding: 12px 16px; }
            .devices-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .device-card { padding: 16px 10px 14px; }
            .device-card .device-icon { font-size: 28px; }
            .device-card .device-title { font-size: 12px; }
            .device-card .device-secondary,
            .device-card .device-desc { font-size: 10px; }
            .bottom-nav { left: 14px; right: 14px; height: 68px; }
            .nav-item span { font-size: 9px; }
            .modal { padding: 22px 18px; }
            .modal-title { font-size: 18px; }
            .modal-info-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 380px) {
            .logo { font-size: 18px; }
            .logo i { font-size: 20px; }
            .icon-btn { width: 40px; height: 40px; font-size: 14px; }
        }

        /* ============ Scrollbar ============ */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
    </style>
</head>
<body>

<!-- ============ الهيدر ============ -->
<header class="header">
    <div class="header-content">
        <a href="#" class="logo" onclick="resetView(event)">
            <i class="fas fa-atlas"></i>
            <span>MedAtlas</span>
        </a>
        <div class="header-actions">
            <button class="icon-btn" id="langBtn" onclick="toggleLanguage()" title="تغيير اللغة">
                <i class="fas fa-globe"></i>
            </button>
            <button class="icon-btn fav-btn" id="favBtn" onclick="toggleFavoritesFilter()" title="المفضلة">
                <i class="far fa-heart"></i>
                <span class="badge" id="favBadge" style="display:none">0</span>
            </button>
            <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="الوضع الليلي">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </div>
</header>

<!-- ============ الحاوية الرئيسية ============ -->
<div class="container">

/* ============================================================
   المفضلة (localStorage)
   ============================================================ */
function loadFavorites() {
    try {
        const saved = localStorage.getItem('medatlas_favorites');
        if (saved) {
            const arr = JSON.parse(saved);
            if (Array.isArray(arr)) state.favorites = new Set(arr);
        }
    } catch (e) {}
    updateFavBadge();
}

function saveFavorites() {
    try {
        localStorage.setItem('medatlas_favorites', JSON.stringify([...state.favorites]));
    } catch (e) {}
    updateFavBadge();
}

function updateFavBadge() {
    const badge = document.getElementById('favBadge');
    const count = state.favorites.size;
    if (count > 0) {
        badge.textContent = count > 99 ? '99+' : count;
        badge.style.display = 'flex';
    } else {
        badge.style.display = 'none';
    }
}

function toggleFavorite(id, event) {
    if (event) event.stopPropagation();
    if (state.favorites.has(id)) {
        state.favorites.delete(id);
        showToast(t('removedFav'));
    } else {
        state.favorites.add(id);
        showToast(t('addedFav'));
    }
    saveFavorites();
    render();
}

/* ============================================================
   الثيم
   ============================================================ */
function toggleTheme() {
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    document.body.classList.toggle('dark-mode', state.theme === 'dark');
    document.getElementById('themeBtn').innerHTML = state.theme === 'dark'
        ? '<i class="fas fa-sun"></i>'
        : '<i class="fas fa-moon"></i>';
    try { localStorage.setItem('medatlas_theme', state.theme); } catch(e) {}
}

function loadTheme() {
    try {
        const saved = localStorage.getItem('medatlas_theme');
        if (saved) state.theme = saved;
    } catch(e) {}
    if (state.theme === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('themeBtn').innerHTML = '<i class="fas fa-sun"></i>';
    }
}

function toggleLanguage() {
    state.lang = state.lang === 'ar' ? 'en' : 'ar';
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
    try { localStorage.setItem('medatlas_lang', state.lang); } catch(e) {}

    // تحديث placeholder
    document.getElementById('searchInput').placeholder = t('searchPlaceholder');

    // تحديث نصوص التنقل
    document.querySelectorAll('.nav-item span').forEach(el => {
        el.textContent = el.dataset[state.lang];
    });

    renderFilters();
    render();
}
